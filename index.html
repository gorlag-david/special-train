<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Real 3D Train Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            overflow: hidden;
            transition: background 0.5s ease;
            touch-action: manipulation;
        }

        /* Day/Night backgrounds */
        body.day {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #90EE90 100%);
        }

        body.night {
            background: linear-gradient(to bottom, #0c1445 0%, #1a237e 50%, #0d47a1 100%);
        }

        #scene {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Three.js canvas */
        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Stars for night mode */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.night .stars {
            opacity: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Sun and Moon */
        .celestial {
            position: absolute;
            top: 10%;
            right: 15%;
            transition: all 0.5s ease;
            z-index: 1;
        }

        .sun {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        .moon {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #F0F0F0 0%, #C0C0C0 100%);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .moon::before {
            content: '';
            position: absolute;
            top: -10px;
            right: -5px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #B0B0B0 0%, #909090 100%);
            border-radius: 50%;
        }

        body.day .moon {
            opacity: 0;
            transform: translateY(-100px);
        }

        body.night .sun {
            opacity: 0;
            transform: translateY(-100px);
        }

        /* Clouds */
        .clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 100px;
            animation: float 20s infinite linear;
        }

        body.night .cloud {
            background: rgba(255, 255, 255, 0.1);
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 100px;
        }

        @keyframes float {
            from { transform: translateX(-200px); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        /* Ground/Track */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to bottom, #8B7355 0%, #654321 50%, #3d2817 100%);
            transition: background 0.5s ease;
        }

        body.night .ground {
            background: linear-gradient(to bottom, #2c2416 0%, #1a1410 50%, #0d0a08 100%);
        }

        .tracks {
            position: absolute;
            bottom: 25%;
            width: 200%;
            height: 10px;
            background: repeating-linear-gradient(
                90deg,
                #4a4a4a 0px,
                #4a4a4a 20px,
                transparent 20px,
                transparent 40px
            );
            animation: scrollBackground 10s infinite linear;
        }

        @keyframes scrollBackground {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Speed variations - Applied to background animations */
        body.speed-slow .tracks,
        body.speed-slow .ground,
        body.speed-slow .coin {
            animation-duration: 20s;
        }

        body.speed-fast .tracks,
        body.speed-fast .ground,
        body.speed-fast .coin {
            animation-duration: 5s;
        }

        body.speed-normal .tracks,
        body.speed-normal .ground,
        body.speed-normal .coin {
            animation-duration: 10s;
        }

        /* Controls - Moved to top-left */
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            max-width: 350px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin: 10px 0;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            touch-action: manipulation;
            min-width: 70px;
        }

        button:active {
            transform: scale(0.95);
        }

        button.active {
            background: #2196F3;
            color: white;
            border-color: #1976D2;
        }

        .toggle-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            touch-action: manipulation;
        }

        /* Coins */
        .coin {
            position: absolute;
            bottom: 35%;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500);
            border-radius: 50%;
            border: 3px solid #DAA520;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: scrollBackground 10s infinite linear;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #DAA520;
        }

        .coin::before {
            content: '$';
            font-size: 18px;
        }

        .coin.collected {
            animation: collectCoin 0.5s ease-out forwards;
        }

        @keyframes collectCoin {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }
        }

        /* Score display */
        .score {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            font-size: 24px;
            font-weight: bold;
            color: #333;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .score span {
            color: #FFD700;
        }

        .controls.hidden {
            display: none;
        }

        /* Filter presets */
        .filter-none { filter: none; }
        .filter-sepia { filter: sepia(80%); }
        .filter-grayscale { filter: grayscale(100%); }
        .filter-blur { filter: blur(2px); }
        .filter-brightness { filter: brightness(1.3); }
        .filter-contrast { filter: contrast(1.5); }
        .filter-saturate { filter: saturate(2); }
        .filter-hue { filter: hue-rotate(90deg); }
        .filter-invert { filter: invert(100%); }
        .filter-vintage { filter: sepia(50%) contrast(1.2) brightness(0.9); }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .engine {
                width: 80px;
                height: 65px;
            }

            .cargo {
                width: 70px;
                height: 55px;
            }

            .cabin {
                width: 40px;
                height: 25px;
            }

            .wheel {
                width: 20px;
                height: 20px;
            }

            .sun, .moon {
                width: 40px;
                height: 40px;
            }

            button {
                padding: 8px 12px;
                font-size: 12px;
                min-width: 60px;
            }

            .controls {
                padding: 12px 15px;
                top: 10px;
                left: 10px;
                max-width: 250px;
            }

            .score {
                padding: 10px 15px;
                font-size: 18px;
                top: 10px;
                right: 10px;
            }

            .coin {
                width: 25px;
                height: 25px;
            }

            .coin::before {
                font-size: 14px;
            }

            .control-group label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body class="day">
    <div id="scene">
        <!-- Stars for night mode -->
        <div class="stars" id="stars"></div>

        <!-- Sun and Moon -->
        <div class="celestial">
            <div class="sun"></div>
            <div class="moon"></div>
        </div>

        <!-- Clouds -->
        <div class="clouds" id="clouds"></div>

        <!-- Ground and tracks -->
        <div class="ground">
            <div class="tracks"></div>
        </div>

        <!-- Three.js 3D Canvas -->
        <canvas id="canvas3d"></canvas>
    </div>

    <!-- Toggle button -->
    <button class="toggle-controls" id="toggleBtn">⚙️</button>

    <!-- Score display -->
    <div class="score">Coins: <span id="scoreValue">0</span></div>

    <!-- Controls -->
    <div class="controls" id="controls">
        <div class="control-group">
            <label>Speed:</label>
            <div class="button-group">
                <button onclick="setSpeed('slow')">🐌 Slow</button>
                <button onclick="setSpeed('normal')" class="active">🚂 Normal</button>
                <button onclick="setSpeed('fast')">⚡ Fast</button>
            </div>
        </div>

        <div class="control-group">
            <label>Time of Day:</label>
            <div class="button-group">
                <button onclick="setTimeOfDay('day')" class="active">☀️ Day</button>
                <button onclick="setTimeOfDay('night')">🌙 Night</button>
            </div>
        </div>

        <div class="control-group">
            <label>Filters:</label>
            <div class="button-group">
                <button onclick="setFilter('none')" class="active">None</button>
                <button onclick="setFilter('sepia')">Sepia</button>
                <button onclick="setFilter('grayscale')">B&W</button>
                <button onclick="setFilter('blur')">Blur</button>
                <button onclick="setFilter('brightness')">Bright</button>
                <button onclick="setFilter('contrast')">Contrast</button>
                <button onclick="setFilter('saturate')">Saturate</button>
                <button onclick="setFilter('hue')">Hue</button>
                <button onclick="setFilter('invert')">Invert</button>
                <button onclick="setFilter('vintage')">Vintage</button>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let score = 0;
        let coinSpawnTimer = null;
        let currentSpeed = 'normal';
        let currentFilter = 'none';

        // Three.js variables
        let scene, camera, renderer, trainGroup;
        let wheels = [];
        let animationSpeed = 1;

        // Initialize scene
        function init() {
            createStars();
            createClouds();
            document.body.classList.add('speed-normal');
            initThreeJS();
            animate();
            startCoinSpawning();
        }

        // Initialize Three.js scene
        function initThreeJS() {
            const canvas = document.getElementById('canvas3d');

            // Create scene
            scene = new THREE.Scene();

            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 5, 12);
            camera.lookAt(0, 0, 0);

            // Create renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Create train
            createTrain();

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        // Create the 3D train
        function createTrain() {
            trainGroup = new THREE.Group();

            // Create engine body
            const engineGeometry = new THREE.BoxGeometry(2, 1.5, 2);
            const engineMaterial = new THREE.MeshPhongMaterial({ color: 0xd32f2f });
            const engine = new THREE.Mesh(engineGeometry, engineMaterial);
            engine.position.set(0, 0.75, 0);
            engine.castShadow = true;
            trainGroup.add(engine);

            // Create cabin on top of engine
            const cabinGeometry = new THREE.BoxGeometry(1, 0.8, 1.2);
            const cabinMaterial = new THREE.MeshPhongMaterial({ color: 0x1976D2 });
            const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
            cabin.position.set(-0.3, 1.9, 0);
            cabin.castShadow = true;
            trainGroup.add(cabin);

            // Create cabin window
            const windowGeometry = new THREE.BoxGeometry(0.05, 0.5, 0.8);
            const windowMaterial = new THREE.MeshPhongMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.7,
                emissive: 0x88ccff,
                emissiveIntensity: 0.3
            });
            const window1 = new THREE.Mesh(windowGeometry, windowMaterial);
            window1.position.set(-0.3, 1.9, 0.61);
            trainGroup.add(window1);

            // Create chimney
            const chimneyGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.6, 8);
            const chimneyMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const chimney = new THREE.Mesh(chimneyGeometry, chimneyMaterial);
            chimney.position.set(0.4, 1.8, 0);
            chimney.castShadow = true;
            trainGroup.add(chimney);

            // Create engine front (boiler front)
            const boilerGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 16);
            const boilerMaterial = new THREE.MeshPhongMaterial({ color: 0xb71c1c });
            const boiler = new THREE.Mesh(boilerGeometry, boilerMaterial);
            boiler.rotation.z = Math.PI / 2;
            boiler.position.set(-1.15, 0.75, 0);
            boiler.castShadow = true;
            trainGroup.add(boiler);

            // Create cargo cars
            const cargoColors = [0xFF9800, 0x4CAF50, 0x2196F3];
            for (let i = 0; i < 3; i++) {
                const cargoGeometry = new THREE.BoxGeometry(1.8, 1.3, 1.8);
                const cargoMaterial = new THREE.MeshPhongMaterial({ color: cargoColors[i] });
                const cargo = new THREE.Mesh(cargoGeometry, cargoMaterial);
                cargo.position.set(2.5 + i * 2.5, 0.65, 0);
                cargo.castShadow = true;
                trainGroup.add(cargo);

                // Add wheels to cargo
                createWheels(trainGroup, 2.5 + i * 2.5);
            }

            // Add wheels to engine
            createWheels(trainGroup, 0);

            // Position the entire train
            trainGroup.position.set(0, 0, 0);
            scene.add(trainGroup);
        }

        // Create wheels for train parts
        function createWheels(parent, xPos) {
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });

            // Left wheels
            const wheelL1 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheelL1.rotation.z = Math.PI / 2;
            wheelL1.position.set(xPos - 0.5, 0, -1.1);
            wheelL1.castShadow = true;
            parent.add(wheelL1);
            wheels.push(wheelL1);

            const wheelL2 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheelL2.rotation.z = Math.PI / 2;
            wheelL2.position.set(xPos + 0.5, 0, -1.1);
            wheelL2.castShadow = true;
            parent.add(wheelL2);
            wheels.push(wheelL2);

            // Right wheels
            const wheelR1 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheelR1.rotation.z = Math.PI / 2;
            wheelR1.position.set(xPos - 0.5, 0, 1.1);
            wheelR1.castShadow = true;
            parent.add(wheelR1);
            wheels.push(wheelR1);

            const wheelR2 = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheelR2.rotation.z = Math.PI / 2;
            wheelR2.position.set(xPos + 0.5, 0, 1.1);
            wheelR2.castShadow = true;
            parent.add(wheelR2);
            wheels.push(wheelR2);

            // Add wheel details (spokes)
            wheels.forEach(wheel => {
                const spokeGeometry = new THREE.BoxGeometry(0.05, 0.6, 0.05);
                const spokeMaterial = new THREE.MeshPhongMaterial({ color: 0x666666 });

                for (let i = 0; i < 4; i++) {
                    const spoke = new THREE.Mesh(spokeGeometry, spokeMaterial);
                    spoke.rotation.y = (Math.PI / 4) * i;
                    wheel.add(spoke);
                }
            });
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate wheels based on speed
            wheels.forEach(wheel => {
                wheel.rotation.y += 0.1 * animationSpeed;
            });

            // Gentle rocking motion for realism
            if (trainGroup) {
                trainGroup.position.y = Math.sin(Date.now() * 0.002) * 0.02;
                trainGroup.rotation.z = Math.sin(Date.now() * 0.001) * 0.01;
            }

            // Auto-rotate camera slightly
            camera.position.x = Math.sin(Date.now() * 0.0002) * 10;
            camera.position.z = Math.cos(Date.now() * 0.0002) * 12 + 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Create stars for night mode
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const numStars = 50;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 70 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Create clouds
        function createClouds() {
            const cloudsContainer = document.getElementById('clouds');
            const numClouds = 5;

            for (let i = 0; i < numClouds; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';

                const size = Math.random() * 40 + 60;
                cloud.style.width = size + 'px';
                cloud.style.height = size * 0.6 + 'px';
                cloud.style.top = Math.random() * 40 + 10 + '%';
                cloud.style.left = Math.random() * 100 + '%';
                cloud.style.animationDuration = Math.random() * 10 + 15 + 's';
                cloud.style.animationDelay = Math.random() * 10 + 's';

                cloudsContainer.appendChild(cloud);
            }
        }

        // Speed control
        function setSpeed(speed) {
            document.body.classList.remove('speed-slow', 'speed-normal', 'speed-fast');
            document.body.classList.add('speed-' + speed);
            currentSpeed = speed;

            // Update 3D animation speed
            if (speed === 'slow') animationSpeed = 0.5;
            else if (speed === 'fast') animationSpeed = 2;
            else animationSpeed = 1;

            updateActiveButton(event.target, 'speed');
        }

        // Day/Night toggle
        function setTimeOfDay(time) {
            document.body.classList.remove('day', 'night');
            document.body.classList.add(time);
            updateActiveButton(event.target, 'time');
        }

        // Filter control (applies to 3D scene)
        function setFilter(filterName) {
            currentFilter = filterName;
            const canvas = document.getElementById('canvas3d');

            // Remove all filter classes
            canvas.className = '';

            // Apply CSS filters to canvas
            switch(filterName) {
                case 'sepia': canvas.style.filter = 'sepia(80%)'; break;
                case 'grayscale': canvas.style.filter = 'grayscale(100%)'; break;
                case 'blur': canvas.style.filter = 'blur(2px)'; break;
                case 'brightness': canvas.style.filter = 'brightness(1.3)'; break;
                case 'contrast': canvas.style.filter = 'contrast(1.5)'; break;
                case 'saturate': canvas.style.filter = 'saturate(2)'; break;
                case 'hue': canvas.style.filter = 'hue-rotate(90deg)'; break;
                case 'invert': canvas.style.filter = 'invert(100%)'; break;
                case 'vintage': canvas.style.filter = 'sepia(50%) contrast(1.2) brightness(0.9)'; break;
                default: canvas.style.filter = 'none';
            }

            updateActiveButton(event.target, 'filter');
        }

        // Update active button state
        function updateActiveButton(button, group) {
            const buttons = button.parentElement.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }

        // Coin spawning
        function startCoinSpawning() {
            function spawnCoin() {
                const coin = document.createElement('div');
                coin.className = 'coin';
                coin.style.left = '100vw';

                const randomOffset = Math.random() * 10 - 5;
                coin.style.bottom = (35 + randomOffset) + '%';

                document.getElementById('scene').appendChild(coin);

                const collisionInterval = setInterval(() => {
                    if (checkCollision(coin)) {
                        collectCoin(coin);
                        clearInterval(collisionInterval);
                    }

                    const coinRect = coin.getBoundingClientRect();
                    if (coinRect.right < 0) {
                        coin.remove();
                        clearInterval(collisionInterval);
                    }
                }, 50);

                const nextSpawnDelay = Math.random() * 7000 + 8000;
                coinSpawnTimer = setTimeout(spawnCoin, nextSpawnDelay);
            }

            const initialDelay = Math.random() * 5000 + 3000;
            coinSpawnTimer = setTimeout(spawnCoin, initialDelay);
        }

        // Check collision (using canvas center approximation)
        function checkCollision(coin) {
            const coinRect = coin.getBoundingClientRect();
            const trainX = window.innerWidth * 0.4; // Approximate train position
            const trainY = window.innerHeight * 0.6;
            const trainWidth = 200;
            const trainHeight = 150;

            return !(coinRect.right < trainX ||
                     coinRect.left > trainX + trainWidth ||
                     coinRect.bottom < trainY ||
                     coinRect.top > trainY + trainHeight);
        }

        // Collect coin
        function collectCoin(coin) {
            if (coin.classList.contains('collected')) return;

            coin.classList.add('collected');
            score++;
            document.getElementById('scoreValue').textContent = score;

            setTimeout(() => {
                coin.remove();
            }, 500);
        }

        // Toggle controls visibility
        document.getElementById('toggleBtn').addEventListener('click', function() {
            const controls = document.getElementById('controls');
            controls.classList.toggle('hidden');
        });

        // Prevent body scroll on mobile
        document.body.addEventListener('touchmove', function(e) {
            if (!e.target.closest('.controls')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Initialize
        init();
    </script>
</body>
</html>
