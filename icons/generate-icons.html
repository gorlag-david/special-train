<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #333; }
        .status {
            margin: 20px 0;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #357abd; }
        #preview { margin-top: 20px; }
        canvas { display: none; }
    </style>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Click the button below to generate all required PNG icons from the SVG.</p>
    <button onclick="generateIcons()">Generate Icons</button>
    <div id="status" class="status"></div>
    <div id="preview"></div>
    <canvas id="canvas"></canvas>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

        async function generateIcons() {
            const statusDiv = document.getElementById('status');
            const previewDiv = document.getElementById('preview');
            statusDiv.innerHTML = 'Generating icons...';
            previewDiv.innerHTML = '';

            try {
                // Load SVG
                const response = await fetch('icon.svg');
                const svgText = await response.text();

                // Create an image from SVG
                const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();

                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    let generated = 0;

                    sizes.forEach(size => {
                        canvas.width = size;
                        canvas.height = size;
                        ctx.clearRect(0, 0, size, size);
                        ctx.drawImage(img, 0, 0, size, size);

                        canvas.toBlob(blob => {
                            const link = document.createElement('a');
                            link.download = `icon-${size}x${size}.png`;
                            link.href = URL.createObjectURL(blob);
                            link.textContent = `Download icon-${size}x${size}.png`;
                            link.style.display = 'block';
                            link.style.padding = '5px';
                            link.click(); // Auto-download

                            previewDiv.appendChild(link);

                            generated++;
                            if (generated === sizes.length) {
                                statusDiv.className = 'status success';
                                statusDiv.innerHTML = `✓ Successfully generated ${sizes.length} icons! Check your downloads folder.`;
                            }
                        }, 'image/png');
                    });

                    URL.revokeObjectURL(url);
                };

                img.src = url;
            } catch (error) {
                statusDiv.className = 'status';
                statusDiv.innerHTML = '✗ Error generating icons: ' + error.message;
            }
        }

        // Instructions
        document.addEventListener('DOMContentLoaded', () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<strong>Instructions:</strong><br>' +
                '1. Click "Generate Icons" button<br>' +
                '2. Icons will automatically download to your Downloads folder<br>' +
                '3. Move the downloaded PNG files to the /icons/ folder';
        });
    </script>
</body>
</html>
