<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sky background -->
  <rect width="512" height="512" fill="#87CEEB"/>

  <!-- Ground -->
  <rect y="380" width="512" height="132" fill="#8B7355"/>

  <!-- Train tracks -->
  <rect y="400" width="512" height="8" fill="#333"/>
  <rect y="420" width="512" height="8" fill="#333"/>

  <!-- Train body -->
  <g id="train">
    <!-- Engine -->
    <rect x="180" y="280" width="120" height="80" fill="#e74c3c" rx="8"/>
    <rect x="185" y="285" width="110" height="40" fill="#3498db" rx="4"/>

    <!-- Chimney -->
    <rect x="220" y="250" width="20" height="30" fill="#34495e"/>
    <circle cx="230" cy="245" r="8" fill="#34495e"/>

    <!-- Smoke puff -->
    <circle cx="225" cy="230" r="12" fill="#95a5a6" opacity="0.7"/>
    <circle cx="235" cy="225" r="10" fill="#95a5a6" opacity="0.6"/>
    <circle cx="230" cy="215" r="8" fill="#95a5a6" opacity="0.5"/>

    <!-- Cabin -->
    <rect x="250" y="260" width="35" height="20" fill="#34495e" rx="2"/>
    <rect x="255" y="265" width="10" height="10" fill="#3498db"/>
    <rect x="270" y="265" width="10" height="10" fill="#3498db"/>

    <!-- Wheels -->
    <circle cx="210" cy="365" r="18" fill="#2c3e50"/>
    <circle cx="210" cy="365" r="10" fill="#7f8c8d"/>
    <circle cx="250" cy="365" r="18" fill="#2c3e50"/>
    <circle cx="250" cy="365" r="10" fill="#7f8c8d"/>

    <!-- Cargo car -->
    <rect x="310" y="295" width="80" height="65" fill="#f39c12" rx="4"/>
    <rect x="315" y="300" width="70" height="30" fill="#e67e22"/>

    <!-- Cargo wheels -->
    <circle cx="330" cy="365" r="15" fill="#2c3e50"/>
    <circle cx="330" cy="365" r="8" fill="#7f8c8d"/>
    <circle cx="370" cy="365" r="15" fill="#2c3e50"/>
    <circle cx="370" cy="365" r="8" fill="#7f8c8d"/>

    <!-- Coupling -->
    <rect x="295" y="325" width="20" height="5" fill="#34495e"/>
  </g>

  <!-- Coin -->
  <circle cx="420" cy="320" r="25" fill="#f1c40f" stroke="#f39c12" stroke-width="3"/>
  <text x="420" y="332" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#e67e22" text-anchor="middle">$</text>

  <!-- Sun -->
  <circle cx="450" cy="60" r="35" fill="#f1c40f"/>
  <circle cx="450" cy="60" r="30" fill="#f39c12"/>
</svg>
